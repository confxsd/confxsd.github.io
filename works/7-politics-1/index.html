<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="script.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      cursor: none;
      overflow: hidden;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100svh;
      width: 100vw;
    }
    canvas {
      display: block;
      /* Fill the full viewport height, keep the 9:16 aspect (auto width),
         and stay centered; any horizontal overflow bleeds off (body clips it).
         The postfx overlay tracks this rect each frame. */
      height: 100vh;
      height: 100svh;
      width: auto;
    }
  </style>
</head>
